spring.application.name=limtic
server.port=${PORT:8080}

# ── Base de données ─────────────────────────────────────────────
# Par défaut : H2 en fichier local (aucune installation nécessaire).
# Pour PostgreSQL : lancer avec le profil "postgres" (voir application-postgres.properties).
spring.datasource.url=jdbc:h2:file:./data/limtic;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# ── Sécurité JWT ────────────────────────────────────────────────
# En production, définir JWT_SECRET (au moins 32 caractères).
app.jwt.secret=${JWT_SECRET:change-me-dev-secret-change-me-dev-secret-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:4000}

# Données créées au premier démarrage (base vide) : comptes de démonstration
# et jeu d'essai du rapport 2025 (CIN fictifs, voir src/main/resources/donnees-essai)
app.seed.enabled=${SEED_DEMO_DATA:true}
app.seed.admin-password=${ADMIN_PASSWORD:admin123}

# ── Google Gemini ───────────────────────────────────────────────
# La clé n'est JAMAIS écrite dans le code : définir la variable d'environnement GEMINI_API_KEY.
# Clé gratuite : https://aistudio.google.com/apikey
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:60}

# ── Partie 2 : rapport d'activité ───────────────────────────────
# Clé de chiffrement des numéros de CIN (AES-256-GCM) : 32 octets encodés en Base64.
# Générer avec :  openssl rand -base64 32
# Sans valeur, une clé de développement est dérivée de JWT_SECRET (à ne pas utiliser en production).
app.cin.key=${CIN_ENCRYPTION_KEY:}
# Durée de validité des liens de téléchargement signés (minutes)
app.rapport.lien-minutes=${RAPPORT_LIEN_MINUTES:10}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

# ── Partie 1 : site public ──────────────────────────────────────
# Adresse du frontend (liens de réinitialisation du mot de passe envoyés par e-mail)
app.front-url=${FRONT_URL:http://localhost:4200}
# Envoi des e-mails (mot de passe oublié). Sans SMTP_HOST, le lien est écrit dans le journal du serveur.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@limtic.local}
# Limitation du débit : requêtes par minute et par IP sur connexion, mot de passe oublié et contact
app.rate-limit.per-minute=${RATE_LIMIT_PER_MINUTE:10}
